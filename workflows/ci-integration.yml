name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# NOTE: this file lives at workflows/ci.yml because the machine that pushed it
# authenticates with an OAuth token lacking the 'workflow' scope, which blocks
# writes to .github/workflows/. Once that scope is added (gh auth refresh
# -s workflow), move this file to .github/workflows/ci.yml to re-arm the
# triggers — workflows only run from .github/workflows/.

jobs:
  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install pydantic duckdb pandas altair
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install "scikit-learn>=1.4"
      - name: Run Python test suite
        run: python -m pytest tests/ -v --tb=short -m "not e2e"
      - name: Upload failure log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-failure-log
          path: .pytest_cache/

  android:
    name: Android (unit + staged sync)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Unit tests
        working-directory: mobile
        run: ./gradlew :app:testDebugUnitTest --console=plain
      - name: Staged sync integration (mock server)
        working-directory: mobile
        run: ./gradlew runStagedSyncIntegration --console=plain
      - name: Upload battery results (if any)
        uses: actions/upload-artifact@v4
        with:
          name: mobile-battery-results
          path: mobile/results/**
